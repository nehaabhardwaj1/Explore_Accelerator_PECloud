/* ══════════════════════════════════════════════════════════════════

/* ─── DESIGN TOKENS ─── */

  ink: "#111827",
  sub: "#6b7280",
  mute: "#9ca3af",
  bg: "#f4f3f8",
  card: "#ffffff",
  border: "#e5e7eb",

/* BPMN lane colors */
const LANE_COLORS = {
  user:     { bg: "#E8EAF6", border: "#5C6BC0", text: "#1A237E" },
  system:   { bg: "#F3E5F5", border: "#9C27B0", text: "#4A148C" },

const MODULES = ["SD - Sales","FI - Finance","MM - Materials","PP - Production","PM - Plant Maintenance","WM - Warehouse","HR - Human Resources","PS - Project System","CS - Customer Service","SCM - Supply Chain"];

const PC_RULES = `SAP S/4HANA PUBLIC CLOUD rules — MANDATORY for every output:
- No T-codes (VA01, ME21N etc.) — use Fiori app name + (F-ID) e.g. Manage Sales Orders (F1797)
- No SPRO/IMG — use "Business Configuration > Area > Activity"
- No RFC/BAPI — use OData API via SAP Integration Suite CPI
- No Z-programs/Z-tables — use CFL (Tier-1) / BAS-RAP (Tier-2) / BTP CAP (Tier-3)
- All roles: SAP_BR_ prefix, assigned via Manage Business Users (F2709)
- Integration: SAP Integration Suite CPI only
- Migration: Migrate Your Data Fiori app only (no LSMW)
- Monitoring: SAP Cloud ALM (no Solution Manager)
- Background jobs: Application Jobs (F3508) (no SM36/SM37)`;

function getLaneColor(r) {
  r = (r || "").toLowerCase();
  if (r.includes("s/4hana") || r.includes("system")) return { bg: "#F9F5FF", bd: "#7E57C2", tx: "#4A148C" };
  if (r.includes("approv") || r.includes("manager") || r.includes("director")) return { bg: "#FFF8E1", bd: "#FFB300", tx: "#E65100" };
  if (r.includes("financ") || r.includes("account") || r.includes("billing") || r.includes("treasury")) return { bg: "#F1F8E9", bd: "#7CB342", tx: "#33691E" };
  if (r.includes("warehouse") || r.includes("receiving") || r.includes("shipping") || r.includes("picking")) return { bg: "#E3F2FD", bd: "#42A5F5", tx: "#0D47A1" };
  return { bg: "#F5F5F5", bd: "#90A4AE", tx: "#37474F" };
}

/* ═══ HORIZONTAL BPMN 2.0 SWIMLANE RENDERER ═══ */
function SwimlaneRenderer({ swimlane, width = 1200 }) {
  if (!swimlane || !swimlane.lanes || !swimlane.lanes.length) return null;
  const [isZoomed, setIsZoomed] = useState(false);

  const LW = 48;         // Lane label width
  const CW = 165;        // Column width per step
  const SG = 20;         // Spacing gap between steps
  const LH = 115;        // Lane row height
  const TH = 48;         // Title bar height
  const BW = 145;        // Box width
  const BH = 72;         // Box height
  const lanes = swimlane.lanes || [];

  // Flatten all lane steps into cross-lane sequence (round-robin)
  const seq = [];
  const maxLen = Math.max(...lanes.map(l => (l.steps || []).length), 0);
  for (let si = 0; si < maxLen; si++) {
    for (let li = 0; li < lanes.length; li++) {
      const steps = (lanes[li].steps || []).filter(s => s.text);
      if (si < steps.length) seq.push({ ...steps[si], laneIdx: li });
    }
  }

  const W = Math.max(width, LW + seq.length * (CW + SG) + 100);
  const H = TH + lanes.length * LH + 6;

  function wrap(t, m) {
    if (!t) return [""];
    if (t.length <= m) return [t];
    const w = t.split(" "), ls = []; let c = "";
    for (const x of w) {
      if ((c + " " + x).trim().length > m) {
        if (c) ls.push(c.trim());
        if (ls.length >= 3) { ls[2] = ls[2].slice(0, m - 1) + "…"; return ls.slice(0, 3); }
        c = x;
      } else c = c ? c + " " + x : x;
    }
    if (c) ls.push(c.trim());
    if (ls.length > 3) { ls[2] = ls[2].slice(0, m - 1) + "…"; return ls.slice(0, 3); }
    return ls.length ? ls : [t.slice(0, m)];
  }

  function renderStep(step, cx, cy) {
    const lines = wrap(step.text, 18);
    const lh = 12;
    const hx = cx - BW / 2, hy = cy - BH / 2;

    // Decision gateway — clean diamond with X, text OUTSIDE below
    if (step.type === "D") {
      const sz = 24;
      return (
        <g>
          <polygon points={`${cx},${cy - sz} ${cx + sz},${cy} ${cx},${cy + sz} ${cx - sz},${cy}`} fill="white" stroke="#455A64" strokeWidth="2" />
          <text x={cx} y={cy + 2} textAnchor="middle" fontSize="15" fontWeight="800" fill="#455A64" fontFamily="Calibri,sans-serif">✕</text>
          <text x={cx} y={cy + sz + 14} textAnchor="middle" fontSize="8.5" fill="#37474F" fontFamily="Calibri,sans-serif" fontWeight="600" fontStyle="italic">
            {lines.slice(0, 2).map((l, i) => <tspan key={i} x={cx} dy={i ? 10 : 0}>{l}</tspan>)}
          </text>
        </g>
      );
    }
    // YES — small label badge, not a full box
    if (step.type === "Y") return (
      <g>
        <rect x={hx} y={hy} width={BW} height={BH} rx="8" fill="#F1F8E9" stroke="#558B2F" strokeWidth="1.2" />
        <text x={cx} y={cy - (lines.length - 1) * lh / 2 + 4} textAnchor="middle" fontSize="9" fill="#33691E" fontFamily="Calibri,sans-serif" fontWeight="600">
          {lines.map((l, i) => <tspan key={i} x={cx} dy={i ? lh : 0}>{l.replace(/^YES\s*[-→>]\s*/i, "")}</tspan>)}
        </text>
        <rect x={cx - 14} y={hy - 8} width="28" height="14" rx="3" fill="#558B2F" />
        <text x={cx} y={hy - 0} textAnchor="middle" fontSize="7.5" fontWeight="800" fill="white" fontFamily="Calibri,sans-serif">YES</text>
      </g>
    );
    // NO — small label badge
    if (step.type === "N") return (
      <g>
        <rect x={hx} y={hy} width={BW} height={BH} rx="8" fill="#FBE9E7" stroke="#C62828" strokeWidth="1.2" />
        <text x={cx} y={cy - (lines.length - 1) * lh / 2 + 4} textAnchor="middle" fontSize="9" fill="#B71C1C" fontFamily="Calibri,sans-serif" fontWeight="600">
          {lines.map((l, i) => <tspan key={i} x={cx} dy={i ? lh : 0}>{l.replace(/^NO\s*[-→>]\s*/i, "")}</tspan>)}
        </text>
        <rect x={cx - 10} y={hy - 8} width="20" height="14" rx="3" fill="#C62828" />
        <text x={cx} y={hy - 0} textAnchor="middle" fontSize="7.5" fontWeight="800" fill="white" fontFamily="Calibri,sans-serif">NO</text>
      </g>
    );
    // System auto — rounded dashed, muted purple subprocess style
    if (step.type === "A") return (
      <g>
        <rect x={hx} y={hy} width={BW} height={BH} rx="8" fill="#EDE7F6" stroke="#5E35B1" strokeWidth="1" strokeDasharray="6,3" />
        <text x={cx} y={cy - (lines.length - 1) * lh / 2 + 4} textAnchor="middle" fontSize="9" fill="#311B92" fontFamily="Calibri,sans-serif" fontWeight="500">
          {lines.map((l, i) => <tspan key={i} x={cx} dy={i ? lh : 0}>{l}</tspan>)}
        </text>
        <circle cx={hx + 12} cy={hy + 12} r="5" fill="none" stroke="#5E35B1" strokeWidth="1" />
        <text x={hx + 12} y={hy + 14.5} textAnchor="middle" fontSize="6" fill="#5E35B1" fontFamily="Calibri,sans-serif">⚙</text>
      </g>
    );
    // User task — white with thin border, subtle blue left accent bar
    return (
      <g>
        <rect x={hx} y={hy} width={BW} height={BH} rx="8" fill="white" stroke="#78909C" strokeWidth="1.2" />
        <rect x={hx} y={hy + 4} width="4" height={BH - 8} rx="2" fill="#1E88E5" />
        <text x={cx + 2} y={cy - (lines.length - 1) * lh / 2 + 4} textAnchor="middle" fontSize="9" fill="#263238" fontFamily="Calibri,sans-serif" fontWeight="600">
          {lines.map((l, i) => <tspan key={i} x={cx + 2} dy={i ? lh : 0}>{l}</tspan>)}
        </text>
      </g>
    );
  }

  // Compute positions
  const positions = seq.map((step, si) => ({
    cx: LW + 50 + si * (CW + SG) + CW / 2,
    cy: TH + step.laneIdx * LH + LH / 2,
    step
  }));

  const svgContent = (
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block", minWidth: isZoomed ? W : 800 }}>
        <defs><marker id="sigArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0.5,8 3,0 5.5" fill="#455A64" /></marker></defs>
        <rect x="0" y="0" width={W} height={TH} fill="#263238" />
        <circle cx="20" cy={TH / 2} r="7" fill="none" stroke="#4DB6AC" strokeWidth="2" />
        <text x="36" y={TH / 2 - 6} fontSize="8" fontWeight="700" fill="#4DB6AC" fontFamily="Calibri,sans-serif" letterSpacing="2">BPMN 2.0 PROCESS FLOW</text>
        <text x="36" y={TH / 2 + 10} fontSize="13" fontWeight="700" fill="white" fontFamily="Georgia,serif">{wrap(swimlane.title || "Process Flow", 65).map((l, i) => <tspan key={i} x="36" dy={i ? 15 : 0}>{l}</tspan>)}</text>
        <text x={W - 16} y={TH / 2 + 4} textAnchor="end" fontSize="9" fill="#4DB6AC" fontFamily="Calibri,sans-serif" fontWeight="600">BPMN 2.0</text>
        {lanes.map((lane, li) => { const lc = getLaneColor(lane.role || lane.name || ""); const ly = TH + li * LH; return (
          <g key={"lane-" + li}>
            <rect x={LW} y={ly} width={W - LW} height={LH} fill={li % 2 === 0 ? "#FAFAFA" : "#FFF"} />
            <line x1="0" y1={ly} x2={W} y2={ly} stroke="#CFD8DC" strokeWidth="0.8" />
            <line x1="0" y1={ly + LH} x2={W} y2={ly + LH} stroke="#CFD8DC" strokeWidth="0.8" />
            <rect x="0" y={ly} width={LW} height={LH} fill={lc.bg} />
            <rect x={LW - 3} y={ly} width="3" height={LH} fill={lc.bd} />
            <text x={LW / 2 - 2} y={ly + LH / 2} textAnchor="middle" dominantBaseline="middle" fontSize="9" fontWeight="700" fill={lc.tx} fontFamily="Calibri,sans-serif" transform={`rotate(-90, ${LW / 2 - 2}, ${ly + LH / 2})`}>{(lane.role || lane.name || "Role").slice(0, 22)}</text>
          </g>); })}
        <line x1={LW} y1={TH} x2={LW} y2={H} stroke="#B0BEC5" strokeWidth="1" />
        {positions.length > 0 && (<g><circle cx={LW + 22} cy={positions[0].cy} r="10" fill="white" stroke="#455A64" strokeWidth="2.5" /><line x1={LW + 34} y1={positions[0].cy} x2={positions[0].cx - BW / 2 - 4} y2={positions[0].cy} stroke="#455A64" strokeWidth="1.5" markerEnd="url(#sigArr)" /></g>)}
        {positions.map(({ cx, cy, step }, si) => (<g key={"s-" + si}>{renderStep(step, cx, cy)}{si < positions.length - 1 && (() => { const next = positions[si + 1]; const fromX = cx + (step.type === "D" ? 30 : BW / 2) + 3; const toX = next.cx - BW / 2 - 4; if (cy === next.cy) return <line x1={fromX} y1={cy} x2={toX} y2={next.cy} stroke="#455A64" strokeWidth="1.3" markerEnd="url(#sigArr)" />; const midX = (fromX + toX) / 2; return <path d={`M${fromX},${cy} L${midX},${cy} L${midX},${next.cy} L${toX},${next.cy}`} fill="none" stroke="#455A64" strokeWidth="1.3" markerEnd="url(#sigArr)" />; })()}</g>))}
        {positions.length > 0 && (() => { const last = positions[positions.length - 1]; const ex = last.cx + BW / 2 + 28; return (<g><line x1={last.cx + BW / 2 + 3} y1={last.cy} x2={ex - 12} y2={last.cy} stroke="#455A64" strokeWidth="1.3" markerEnd="url(#sigArr)" /><circle cx={ex} cy={last.cy} r="10" fill="white" stroke="#455A64" strokeWidth="3.5" /></g>); })()}
        <rect x="0" y={H - 4} width={W} height="4" fill="#263238" />
      </svg>
  );

  if (isZoomed) return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, zIndex: 9999, background: "rgba(0,0,0,0.75)", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 20px", background: "#263238", flexShrink: 0 }}>
        <span style={{ color: "#4DB6AC", fontSize: 14, fontWeight: 700 }}>{"🔍 " + (swimlane.title || "Process Flow") + " — Expanded View"}</span>
        <button onClick={() => setIsZoomed(false)} style={{ background: "#E53935", color: "white", border: "none", borderRadius: 6, padding: "6px 18px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>{"✕ Close"}</button>
      </div>
      <div style={{ flex: 1, overflow: "auto", padding: 20, background: "#ECEFF1" }}>
        <div style={{ background: "white", borderRadius: 10, border: "2px solid #90A4AE", boxShadow: "0 8px 32px rgba(0,0,0,0.15)", minWidth: W }}>{svgContent}</div>
      </div>
    </div>
  );

  return (
    <div style={{ position: "relative", margin: "12px 0", borderRadius: 8, border: "1.5px solid #90A4AE", background: "white", boxShadow: "0 2px 12px rgba(0,0,0,0.06)", cursor: "pointer" }} onClick={() => setIsZoomed(true)}>
      <div style={{ overflowX: "auto" }}>{svgContent}</div>
      <div style={{ position: "absolute", top: 8, right: 8, background: "rgba(38,50,56,0.85)", color: "#4DB6AC", borderRadius: 6, padding: "4px 10px", fontSize: 10, fontWeight: 700, pointerEvents: "none" }}>{"🔍 Click to expand"}</div>
    </div>
  );
}



function buildStructurePrompt(form) {
  const ctx = `Project: ${form.projectName || "SAP Project"} | Client: ${form.client || "Client"} | Module: ${form.module} | In-Scope: ${form.inScope || "All"} | Stakeholders: ${form.stakeholders || "N/A"} | Integrations: ${form.integrations || "None"}`;
  return `${PC_RULES}

SAP S/4HANA PUBLIC CLOUD Process Architect. Generate L2, L3, and L4 structure as JSON. NO swimlanes. NO l5Config (that comes separately).

${ctx}
Description: ${form.description}

Return ONLY valid JSON. No markdown. No backticks. Start with { end with }.

{
"l2":{"name":"...","description":"...","kpis":["..."],"scopeItems":["BD9 - Sell from Stock","BNH - Credit Management"]},
"l3Areas":[{"id":"L3-001","name":"...","scopeItem":"BD9 - Sell from Stock","description":"...","primaryRole":"SAP_BR_...","fioriApps":["App (F-ID)"],"inputs":["..."],"outputs":["..."]}],
"l4Activities":[{"id":"L4-001","parentL3":"L3-001","scopeItem":"BD9 - Sell from Stock","name":"...","role":"SAP_BR_...","fioriApp":"App (F-ID)","appType":"Transactional","preconditions":["..."],"steps":["Step 1","Step 2"],"keyFields":[{"label":"...","odata":"...","entity":"A_...","mandatory":true}]}]
}

RULES:
- EVERY l3Areas item MUST have a real scopeItem ID from rapid.sap.com/bp in format "ID - Name" (e.g. "BD9 - Sell from Stock", "BNH - Credit Management", "BKP - Billing")
- EVERY l4Activities item MUST have a real scopeItem ID matching its parent L3 area
- l2.scopeItems MUST list ALL unique scope item IDs across the process (minimum 4)
- l3Areas: exactly 4 items, keep descriptions under 15 words
- l4Activities: exactly 4 items, 6 steps each, 3 keyFields each
- Be SPECIFIC to: ${form.module} — ${form.inScope}
- Every Fiori app has (F-ID). All roles SAP_BR_ prefix.
- Real scope item IDs from rapid.sap.com/bp`;
}

function buildL5Prompt(form, l4Activities) {
  const l4List = (l4Activities || []).map(a => `${a.id}: ${a.name} (${a.fioriApp || ""})`).join(", ");
  return `${PC_RULES}

SAP S/4HANA PUBLIC CLOUD Configuration Expert. Generate L5 Business Configuration items as JSON.

Module: ${form.module}
In-Scope: ${form.inScope || "All"}
Description: ${form.description?.slice(0, 400) || ""}
L4 Activities: ${l4List}

Return ONLY a JSON array. Start with [ end with ].

[{"id":"L5-001","name":"Config Area Name","scopeItem":"BD9 - Sell from Stock","path":"Business Configuration > Area > Sub-Area > Activity","purpose":"What this controls","linkedL4":["L4-001"],"keySettings":[{"field":"Field Name","value":"Setting Value","impact":"What changes","recommended":"SAP best practice ideal value","rationale":"Why this is the ideal setting"}]}]

RULES:
- Generate EXACTLY 6 config items (L5-001 through L5-006)
- Every path MUST start with "Business Configuration >"
- Each item MUST have exactly 2-3 keySettings
- Each keySetting MUST have "recommended" (SAP ideal value) and "rationale" (why ideal)
- Be SPECIFIC to ${form.module}`;
}

function buildSwimlanesPrompt(areas, module) {
  const areaList = areas.map(a => `${a.id}: "${a.name}" — role: ${a.role || a.primaryRole}, apps: ${a.apps || (a.fioriApps||[]).join(", ")}`).join("\n");
  return `SAP S/4HANA PUBLIC CLOUD BPMN expert. Generate swimlane diagrams as JSON.

Process areas:
${areaList}

Module: ${module}

Return ONLY JSON object. No markdown. No backticks. Start with { end with }.

{"${areas[0]?.id || "L3-001"}":{"title":"ID: Name — Scope","lanes":[{"role":"SAP_BR_XXX","steps":[{"type":"S","text":"Opens App (F-ID) from Launchpad"},{"type":"S","text":"Enters fields"},{"type":"D","text":"Question?"},{"type":"Y","text":"YES path"},{"type":"N","text":"NO path"}]},{"role":"S/4HANA System","steps":[{"type":"A","text":"Auto check"},{"type":"A","text":"Auto post"}]}]}}

RULES:
- Each swimlane: 2-3 lanes, each lane 4-6 steps
- [S] = user task, MUST include Fiori app + (F-ID)
- [A] = system automation, dashed style
- [D] = decision diamond, followed by [Y] and [N]
- Use SAP_BR_ role names
- Keep step text under 60 chars
- Start with { end with }`;
}

function buildE2EPrompt(l2Name, l3Areas, module) {
  const areas = (l3Areas || []).map(a => `${a.id}: ${a.name} (${a.scopeItem})`).join(", ");
  return `SAP S/4HANA PUBLIC CLOUD BPMN expert. Generate ONE end-to-end swimlane.

E2E Process: ${l2Name}
Module: ${module}
Areas covered: ${areas}

Return ONLY JSON. No markdown. Start with { end with }.

{"title":"End-to-End: ${l2Name} — Full Happy Path","lanes":[{"role":"SAP_BR_INITIATOR","steps":[{"type":"S","text":"Step in App (F-ID)"},{"type":"S","text":"Next step"},{"type":"D","text":"Decision?"},{"type":"Y","text":"YES"},{"type":"N","text":"NO"}]},{"role":"S/4HANA System","steps":[{"type":"A","text":"Auto action 1"},{"type":"A","text":"Auto action 2"},{"type":"A","text":"Auto action 3"}]},{"role":"SAP_BR_APPROVER","steps":[{"type":"S","text":"Reviews in App (F-ID)"},{"type":"S","text":"Approves"}]},{"role":"SAP_BR_FINANCE","steps":[{"type":"S","text":"Posts in App (F-ID)"},{"type":"D","text":"Correct?"},{"type":"Y","text":"YES — complete"},{"type":"N","text":"NO — correction"}]}]}

RULES:
- 3-4 lanes covering the FULL process from start to finish
- 5-7 steps per lane — cover every major step across ALL L3 areas
- Include S/4HANA System lane with all automations
- [S] steps MUST have Fiori app + (F-ID)
- Include 2 decision points [D] with [Y]/[N]
- This is the MASTER diagram — comprehensive
- Start with { end with }`;
}

  },
  {
    id: "steps", icon: "🚀", title: "2. Step-by-Step Usage Guide",

function exportPPTX(form, d) {
  const tryBuild = () => {
    try { buildPptxSlides(form, d); }
    catch(err) { alert("PPT Error: " + err.message); console.error("PPT:", err); }
  };
  if (window.PptxGenJS) { tryBuild(); return; }

  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js";
  s.onload = () => setTimeout(() => { if (window.PptxGenJS) tryBuild(); else alert("Library loaded but PptxGenJS not found. Try again."); }, 300);
  s.onerror = () => alert("Cannot load PowerPoint library. Your network may block CDN access. Use Word export instead.");
  document.head.appendChild(s);
}

function buildPptxSlides(form, d) {
  // Draw actual BPMN swimlane diagram using shapes (matches on-screen SVG)
  function swDiagram(sl, sw, title, subtitle) {
    hdr(sl, "Swimlane: " + (title || ""), (subtitle || "") + " — BPMN 2.0 Process Flow");
    const lanes = sw.lanes || [];
    if (!lanes.length) return;

    // Interleave steps across lanes (cross-lane flow — same logic as SVG renderer)
    const seq = [];
    const maxLen = Math.max(...lanes.map(l => (l.steps || []).length), 0);
    for (let si = 0; si < maxLen; si++) {
      for (let li = 0; li < lanes.length; li++) {
        const steps = (lanes[li].steps || []).filter(s => s.text);
        if (si < steps.length) seq.push({ ...steps[si], li: li });
      }
    }
    if (!seq.length) return;

    // Layout constants (inches)
    const LBL_W = 0.5;    // Lane label width
    const TOP_Y = 0.85;   // Start below header
    const BOT_Y = 5.25;   // Bottom margin
    const LANE_AREA = BOT_Y - TOP_Y;
    const LANE_H = LANE_AREA / lanes.length;
    const BOX_W = 0.85;
    const BOX_H = Math.min(0.45, LANE_H * 0.55);
    const GAP_X = 0.12;
    const START_X = LBL_W + 0.35;
    const STEP_PITCH = BOX_W + GAP_X;

    // Limit steps to fit on slide
    const maxSteps = Math.min(seq.length, Math.floor((9.5 - START_X) / STEP_PITCH));
    const visibleSeq = seq.slice(0, maxSteps);

    // Colors per type
    const TC = { S: { fill: "EEF2FF", line: "546E7A", font: "1A237E", top: "1E88E5" }, A: { fill: "EDE7F6", line: "7B1FA2", font: "311B92", dash: true }, D: { fill: "FFFDE7", line: "E65100", font: "E65100" }, Y: { fill: "E8F5E9", line: "2E7D32", font: "1B5E20" }, N: { fill: "FFEBEE", line: "C62828", font: "B71C1C" } };
    const LC = [{ bg: "E8EAF6", bd: "5C6BC0", tx: "1A237E" }, { bg: "F3E5F5", bd: "7B1FA2", tx: "4A148C" }, { bg: "FFF8E1", bd: "F9A825", tx: "E65100" }, { bg: "E8F5E9", bd: "43A047", tx: "1B5E20" }, { bg: "E3F2FD", bd: "1E88E5", tx: "0D47A1" }];

    // Draw lane backgrounds + labels
    lanes.forEach((lane, li) => {
      const ly = TOP_Y + li * LANE_H;
      const lc = LC[li % LC.length];
      const isSystem = (lane.role || "").toLowerCase().includes("system");

      // Lane background (alternating)
      sl.addShape(pres.shapes.RECTANGLE, { x: LBL_W, y: ly, w: 9.5 - LBL_W, h: LANE_H, fill: { color: li % 2 === 0 ? "FAFAFA" : W }, line: { color: "CFD8DC", width: 0.3 } });

      // Lane label
      sl.addShape(pres.shapes.RECTANGLE, { x: 0.15, y: ly, w: LBL_W, h: LANE_H, fill: { color: lc.bg }, line: { color: lc.bd, width: 1 } });
      sl.addText((lane.role || lane.name || "Role").slice(0, 18), { x: 0.15, y: ly, w: LBL_W, h: LANE_H, fontSize: 7, fontFace: "Calibri", color: lc.tx, bold: true, align: "center", valign: "middle", rotate: 270, margin: 0 });
    });

    // Draw start circle in first step's lane
    const startLane = visibleSeq[0].li;
    const startY = TOP_Y + startLane * LANE_H + LANE_H / 2;
    sl.addShape(pres.shapes.OVAL, { x: LBL_W + 0.08, y: startY - 0.12, w: 0.24, h: 0.24, fill: { color: W }, line: { color: "455A64", width: 2 } });

    // Arrow from start to first box
    const firstX = START_X;
    sl.addShape(pres.shapes.RECTANGLE, { x: LBL_W + 0.33, y: startY - 0.01, w: firstX - LBL_W - 0.35, h: 0.02, fill: { color: "455A64" } });

    // Draw each step
    visibleSeq.forEach((step, si) => {
      const sx = START_X + si * STEP_PITCH;
      const laneY = TOP_Y + step.li * LANE_H;
      const cy = laneY + LANE_H / 2;
      const tc = TC[step.type] || TC.S;
      const txt = (step.text || "").slice(0, 28);

      if (step.type === "D") {
        // Diamond gateway
        const ds = BOX_H * 0.8;
        sl.addShape(pres.shapes.DIAMOND, { x: sx + (BOX_W - ds) / 2, y: cy - ds / 2, w: ds, h: ds, fill: { color: tc.fill }, line: { color: tc.line, width: 1.5 } });
        sl.addText("✕", { x: sx + (BOX_W - ds) / 2, y: cy - ds / 2, w: ds, h: ds, fontSize: 12, fontFace: "Calibri", color: tc.font, bold: true, align: "center", valign: "middle", margin: 0 });
        // Question text below diamond
        sl.addText(txt, { x: sx - 0.1, y: cy + ds / 2 + 0.02, w: BOX_W + 0.2, h: 0.22, fontSize: 5.5, fontFace: "Calibri", color: "795548", align: "center", italic: true, margin: 0 });
      } else {
        // Rectangle box
        const isRounded = step.type === "A";
        const shape = isRounded ? pres.shapes.ROUNDED_RECTANGLE : pres.shapes.RECTANGLE;
        const bx = sx;
        const by = cy - BOX_H / 2;

        sl.addShape(shape, { x: bx, y: by, w: BOX_W, h: BOX_H, fill: { color: tc.fill }, line: { color: tc.line, width: 1, dashType: tc.dash ? "dash" : "solid" }, rectRadius: isRounded ? 0.1 : 0.04 });

        // Top accent bar for user tasks
        if (step.type === "S" && tc.top) {
          sl.addShape(pres.shapes.RECTANGLE, { x: bx, y: by, w: BOX_W, h: 0.04, fill: { color: tc.top } });
        }

        // YES/NO label badge
        if (step.type === "Y" || step.type === "N") {
          const lbl = step.type === "Y" ? "YES" : "NO";
          const lbg = step.type === "Y" ? "2E7D32" : "C62828";
          sl.addShape(pres.shapes.ROUNDED_RECTANGLE, { x: bx + BOX_W / 2 - 0.2, y: by - 0.1, w: 0.4, h: 0.14, fill: { color: lbg }, rectRadius: 0.03 });
          sl.addText(lbl, { x: bx + BOX_W / 2 - 0.2, y: by - 0.1, w: 0.4, h: 0.14, fontSize: 6, fontFace: "Calibri", color: W, bold: true, align: "center", valign: "middle", margin: 0 });
        }

        // Step text
        sl.addText(txt, { x: bx + 0.04, y: by + (step.type === "S" ? 0.05 : 0.02), w: BOX_W - 0.08, h: BOX_H - (step.type === "S" ? 0.07 : 0.04), fontSize: 6.5, fontFace: "Calibri", color: tc.font, align: "center", valign: "middle", margin: 0 });
      }

      // Connector arrow to next step
      if (si < visibleSeq.length - 1) {
        const next = visibleSeq[si + 1];
        const fromX = sx + BOX_W;
        const fromY = cy;
        const toX = START_X + (si + 1) * STEP_PITCH;
        const toY = TOP_Y + next.li * LANE_H + LANE_H / 2;

        if (Math.abs(fromY - toY) < 0.01) {
          // Same lane — horizontal line
          sl.addShape(pres.shapes.RECTANGLE, { x: fromX, y: fromY - 0.01, w: toX - fromX, h: 0.02, fill: { color: "455A64" } });
          // Arrowhead
          sl.addShape(pres.shapes.ISOSCELES_TRIANGLE, { x: toX - 0.06, y: toY - 0.04, w: 0.06, h: 0.08, fill: { color: "455A64" }, rotate: 90 });
        } else {
          // Cross-lane — L-shaped connector
          const midX = fromX + (toX - fromX) / 2;
          // Horizontal part 1
          sl.addShape(pres.shapes.RECTANGLE, { x: fromX, y: fromY - 0.01, w: midX - fromX, h: 0.02, fill: { color: "455A64" } });
          // Vertical part
          const vTop = Math.min(fromY, toY);
          const vH = Math.abs(toY - fromY);
          sl.addShape(pres.shapes.RECTANGLE, { x: midX - 0.01, y: vTop, w: 0.02, h: vH, fill: { color: "455A64" } });
          // Horizontal part 2
          sl.addShape(pres.shapes.RECTANGLE, { x: midX, y: toY - 0.01, w: toX - midX, h: 0.02, fill: { color: "455A64" } });
          // Arrowhead
          sl.addShape(pres.shapes.ISOSCELES_TRIANGLE, { x: toX - 0.06, y: toY - 0.04, w: 0.06, h: 0.08, fill: { color: "455A64" }, rotate: 90 });
        }
      }
    });

    // End circle after last step
    const lastStep = visibleSeq[visibleSeq.length - 1];
    const lastX = START_X + (visibleSeq.length - 1) * STEP_PITCH + BOX_W + 0.08;
    const lastY = TOP_Y + lastStep.li * LANE_H + LANE_H / 2;
    sl.addShape(pres.shapes.RECTANGLE, { x: lastX - 0.08, y: lastY - 0.01, w: 0.16, h: 0.02, fill: { color: "455A64" } });
    sl.addShape(pres.shapes.OVAL, { x: lastX + 0.1, y: lastY - 0.12, w: 0.24, h: 0.24, fill: { color: W }, line: { color: "455A64", width: 3 } });

    // Legend
    sl.addText("● Start   ▭ User Task   ◇ Gateway   ⚙ System   ✓ YES   ✗ NO   ◉ End", { x: 0.4, y: 5.3, w: 9, h: 0.18, fontSize: 7, fontFace: "Calibri", color: G, margin: 0 });

  if (!d) { alert("No data to export. Generate content first."); return; }

  const pres = new window.PptxGenJS();

  s1.addText([
    { text: (form.projectName || "Workshop") + "\n", options: { fontSize: 34, fontFace: "Georgia", color: W, bold: true } },

    { text: (form.client || "") + " · " + form.module, options: { fontSize: 12, fontFace: "Calibri", color: G } }

  // ═══ SLIDE 2: L2 OVERVIEW ═══
  if (d.l2) {

  // ═══ L4 SLIDES + SWIMLANE DIAGRAMS ═══
  (d.l4Activities || []).forEach(act => {

     [partialItems.length, "PARTIAL FIT", "Config or minor adjustment", "D97706", "FFFBEB"],
     [gapItems.length, "GAP", "Extension or process change", "DC2626", "FEF2F2"]].forEach(([n, l, desc, c, bg], i) => {
      s.addShape(pres.shapes.RECTANGLE, { x: 0.5 + i * 3.1, y: 1.0, w: 2.8, h: 1.1, fill: { color: bg } });
      s.addText(String(n), { x: 0.5 + i * 3.1, y: 1.0, w: 1.4, h: 1.1, fontSize: 36, fontFace: "Georgia", color: c, bold: true, align: "center", valign: "middle", margin: 0 });
      s.addText([
        { text: l + "\n", options: { fontSize: 12, fontFace: "Calibri", color: c, bold: true } },

  // ═══ NEXT STEPS ═══

function App() {
  const [phase, setPhase] = useState("input"); // input | loading | result
  const [showHelp, setShowHelp] = useState(false);
  const [form, setForm] = useState({
    description: "", projectName: "", client: "", module: "SD - Sales",
    inScope: "", stakeholders: "", integrations: ""
  });
  const sf = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const [error, setError] = useState("");
  const [progress, setProgress] = useState(0);

  const [expandedL4, setExpandedL4] = useState(null);
  const [expanded, setExpanded] = useState(new Set()); // tracks expanded item IDs across all sections
  const toggleExpand = (id) => setExpanded(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const [l2View, setL2View] = useState("infographic");
  const [l3View, setL3View] = useState("infographic");
  const [l4View, setL4View] = useState("infographic");
  const [l5View, setL5View] = useState("cards");

  // Auto-fill from description
  const [autoFilling, setAutoFilling] = useState(false);
  const [autoFilled, setAutoFilled] = useState(new Set());
  const debounceRef = useRef(null);

  useEffect(() => {
    const desc = form.description.trim();
    if (desc.length < 50) { setAutoFilled(new Set()); return; }
    clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => {
      setAutoFilling(true);
      // Truncate very long descriptions to avoid token overflow on input
      const shortDesc = desc.length > 800 ? desc.slice(0, 800) + "..." : desc;
      // Escape quotes in description
      const safeDesc = shortDesc.replace(/"/g, '\\"').replace(/\n/g, ' ');
      const extractPrompt = `Extract metadata from this SAP project description. Return ONLY a JSON object — no markdown, no backticks, no explanation.

Description: "${safeDesc}"

Return exactly this JSON structure:
{"projectName":"short 2-5 word project name","client":"company name","module":"pick exactly one: SD - Sales, FI - Finance, MM - Materials, PP - Production, PM - Plant Maintenance, WM - Warehouse, HR - Human Resources, PS - Project System, CS - Customer Service, SCM - Supply Chain","inScope":"comma-separated key processes (max 8 items, short phrases)","stakeholders":"comma-separated key roles (max 6)","integrations":"comma-separated external systems or empty"}

Start with { end with }. No other text.`;

      fetch("/api/bpd/autofill", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: extractPrompt, max_tokens: 500 })
      }).then(r => r.json()).then(d => {
        if (d.error) throw new Error(typeof d.error === "string" ? d.error : (d.error.message || "Auto-fill failed"));
        const raw = (d.content || []).map(c => c.text || "").join("").trim().replace(/^```[a-z]*\n?/, "").replace(/\n?```$/, "").trim();
        let p;
        try { p = JSON.parse(raw); } catch(e) {
          // Try recovery — close any unclosed braces
          let fixed = raw.replace(/,\s*$/, "");
          if (!fixed.endsWith("}")) fixed += '"}';
          if ((fixed.match(/{/g)||[]).length > (fixed.match(/}/g)||[]).length) fixed += "}";
          p = JSON.parse(fixed);
        }
        const filled = new Set();
        setForm(prev => {
          const n = { ...prev };
          ["projectName","client","module","inScope","stakeholders","integrations"].forEach(k => {
            const v = p[k]?.trim();
            if (v && (!prev[k] || prev[k] === "" || prev[k] === "SD - Sales")) {
              if (k === "module") {
                const m = MODULES.find(m => m === v) || MODULES.find(m => m.split(" - ")[0].trim() === v.split(" - ")[0].trim()) || MODULES.find(m => m.toLowerCase().includes(v.toLowerCase().split(" ")[0]));
                n[k] = m || prev[k];
              } else {
                n[k] = v;
              }
              filled.add(k);
            }
          });
          return n;
        });
        setAutoFilled(filled);
      }).catch((e) => { console.log("Auto-fill error:", e); }).finally(() => setAutoFilling(false));
    }, 1200);
    return () => clearTimeout(debounceRef.current);
  }, [form.description]);

  // Robust JSON parser — recovers truncated JSON from AI
  function safeParseJSON(raw) {
    raw = (raw || "").trim().replace(/^```[a-z]*\n?/, "").replace(/\n?```$/, "").trim();
    // Try direct parse first
    try { return JSON.parse(raw); } catch(e) { /* continue recovery */ }
    // Try adding closing braces/brackets
    let attempt = raw;
    const opens = (attempt.match(/[{\[]/g) || []).length;
    const closes = (attempt.match(/[}\]]/g) || []).length;
    // Remove trailing comma or incomplete key
    attempt = attempt.replace(/,\s*$/, "").replace(/,\s*"[^"]*"?\s*$/, "");
    // Close open arrays/objects
    const stack = [];
    let inStr = false, esc = false;
    for (const ch of attempt) {
      if (esc) { esc = false; continue; }
      if (ch === "\\") { esc = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === "{") stack.push("}");
      else if (ch === "[") stack.push("]");
      else if (ch === "}" || ch === "]") stack.pop();
    }
    // If we're inside an unclosed string, close it
    if (inStr) attempt += '"';
    // Close remaining open brackets/braces
    while (stack.length) attempt += stack.pop();
    try { return JSON.parse(attempt); } catch(e2) {
      // Last resort: try to extract the largest valid JSON object
      const match = raw.match(/^\{[\s\S]*/);
      if (match) {
        let s = match[0];
        // Progressively trim from end until parseable
        for (let i = s.length; i > 10; i--) {
          let sub = s.slice(0, i).replace(/,\s*$/, "");
          const st2 = [];
          let inS2 = false, esc2 = false;
          for (const c of sub) { if(esc2){esc2=false;continue;}if(c==="\\"){esc2=true;continue;}if(c==='"'){inS2=!inS2;continue;}if(inS2)continue;if(c==="{")st2.push("}");else if(c==="[")st2.push("]");else if(c==="}"||c==="]")st2.pop(); }
          if(inS2) sub += '"';
          while(st2.length) sub += st2.pop();
          try { return JSON.parse(sub); } catch(e3) { continue; }
        }
      }
      throw new Error("Could not parse AI response. Please try again.");
    }
  }

  // Call AI helper — proxied through server
  function callAI(prompt, tokens) {
    return fetch("/api/bpd/proxy", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, max_tokens: tokens })
    }).then(r => r.json()).then(d => {
      const err = d.error || d.detail;
      if (err) throw new Error(typeof err === "string" ? err : (err.message || "AI call failed"));
      return (d.content || []).map(c => c.text || "").join("");
    });
  }

  // Build swimlane prompt for a specific set of areas
  function buildSwimlanesPromptFromData(structureData) {
    const areas = [
      ...(structureData.l3Areas || []).map(a => ({ id: a.id, name: a.name, role: a.primaryRole, apps: (a.fioriApps||[]).join(", ") })),
      ...(structureData.l4Activities || []).slice(0, 4).map(a => ({ id: a.id, name: a.name, role: a.role, apps: a.fioriApp || "" }))
    ];
    return buildSwimlanesPrompt(areas, form.module);
  }

  // Four-phase generation: Structure → L5 → Swimlanes → E2E → then ALWAYS FTS+Next+As-Is
  function generate() {
    setPhase("loading");
    setProgress(0);
    setError("");
    let structure = null;

    // Finalize: ALWAYS runs FTS + Next Steps + As-Is before showing results
    function finalize(struct) {
      setProgress(90);
      const t5 = setInterval(() => setProgress(p => Math.min(p + 0.5, 98)), 200);
      Promise.all([
        callAI(promptFTS(form), 4096).then(r => { try { struct.fts = safeParseJSON(r); } catch(e) { console.log("FTS parse error:", e.message); } }).catch(e => console.log("FTS call error:", e.message)),
        callAI(promptNextSteps(form), 4096).then(r => { try { struct.next = safeParseJSON(r); } catch(e) { console.log("Next parse error:", e.message); } }).catch(e => console.log("Next call error:", e.message)),
        callAI(promptAsIs(form), 4096).then(r => { try { struct.asIsSwimlane = safeParseJSON(r); } catch(e) { console.log("As-Is parse error:", e.message, "Raw:", r?.slice(0, 200)); } }).catch(e => console.log("As-Is call error:", e.message))
      ]).then(() => {
        clearInterval(t5);
        console.log("Finalize done. FTS:", !!struct.fts, "Next:", !!struct.next, "AsIs:", !!struct.asIsSwimlane);
        setData(struct); setProgress(100);
        setTimeout(() => { setPhase("result"); setActiveTab("full"); }, 400);
      });
    }

    // ─── PHASE 1: Structure (L2/L3/L4 only) ───
    const t1 = setInterval(() => setProgress(p => Math.min(p + 0.7, 24)), 300);
    callAI(buildStructurePrompt(form), 4096)
      .then(raw => {
        clearInterval(t1); setProgress(26);
        structure = safeParseJSON(raw);
        if (!structure.l3Areas) structure.l3Areas = [];
        if (!structure.l4Activities) structure.l4Activities = [];
        structure.l5Config = [];

        // ─── PHASE 2: L5 Config (dedicated call) ───
        const t2 = setInterval(() => setProgress(p => Math.min(p + 0.8, 48)), 250);
        return callAI(buildL5Prompt(form, structure.l4Activities), 4096).then(l5Raw => {
          clearInterval(t2); setProgress(50);
          try {
            const l5p = safeParseJSON(l5Raw);
            structure.l5Config = Array.isArray(l5p) ? l5p : (l5p.l5Config || l5p.config || []);

    function swimlaneToWordHtml(sw) {
      if (!sw || !sw.lanes || !sw.lanes.length) return "";
      const P = [];
      const bdr = "#D0CBE0";

      // Title bar
      P.push(`<table style="border-collapse:collapse;width:100%;margin:16pt 0 0;"><tr>`);
      P.push(`<td style="background:${ACC};color:#fff;padding:8pt 14pt;font-weight:bold;font-size:10pt;letter-spacing:0.5pt;">&#9654; SWIMLANE DIAGRAM: ${esc(sw.title || "Process Flow")}</td>`);
      P.push(`</tr></table>`);

      // Legend
      P.push(`<table style="border-collapse:collapse;width:100%;margin:0 0 0;border-left:2pt solid ${ACC};border-right:2pt solid ${ACC};"><tr>`);
      const legs = [
        ["#EEF2FF","#5C6BC0","&#9632; User Task"],
        ["#F3E5F5","#9C27B0","&#9654; System Auto"],
        ["#FFF9C4","#F9A825","&#9670; Decision"],
        ["#E8F5E9","#43A047","&#10003; YES"],
        ["#FFEBEE","#E53935","&#10007; NO"]
      ];
      legs.forEach(([bg,bd,lbl]) => {
        P.push(`<td style="background:${bg};border:1pt solid ${bd};padding:3pt 8pt;font-size:7.5pt;text-align:center;color:#333;font-weight:600;">${lbl}</td>`);
      });
      P.push(`</tr></table>`);

      // Main swimlane table: each lane is a row with [role header | steps grid]
      P.push(`<table style="border-collapse:collapse;width:100%;border:2pt solid ${ACC};margin:0 0 20pt;">`);

      sw.lanes.forEach((lane, li) => {
        const lc = getLaneColor(lane.role || lane.name || "");
        const steps = (lane.steps || []).filter(s => s.text);
        const isSystem = (lane.role || lane.name || "").toLowerCase().includes("system") || (lane.role || lane.name || "").toLowerCase().includes("s/4hana");

        // Group steps: singles flow down, Y/N pair side-by-side
        const groups = [];
        let si = 0;
        while (si < steps.length) {
          const s = steps[si];
          if ((s.type === "Y" || s.type === "N") && si + 1 < steps.length && (steps[si+1].type === "Y" || steps[si+1].type === "N")) {
            groups.push({ type: "branch", items: [steps[si], steps[si+1]] });
            si += 2;
          } else {
            groups.push({ type: "single", step: s });
            si++;
          }
        }

        // Render step box
        function stepBox(step, fullWidth) {
          const w = fullWidth ? "100%" : "48%";
          if (step.type === "D") {
            // Decision — diamond-style box with thick yellow border
            return `<table style="border-collapse:collapse;width:100%;margin:4pt 0;"><tr><td style="text-align:center;padding:0;">
              <div style="display:inline-block;background:#FFF9C4;border:2.5pt solid #F9A825;padding:8pt 16pt;text-align:center;max-width:90%;">
                <span style="font-size:12pt;color:#F9A825;font-weight:bold;">&#9670;</span>
                <span style="font-size:8.5pt;font-weight:bold;color:#E65100;"> ${esc(step.text)}</span>
              </div>
            </td></tr></table>`;
          }
          if (step.type === "Y") {
            return `<div style="background:#E8F5E9;border:1.5pt solid #43A047;padding:6pt 10pt;margin:3pt 0;width:${w};display:inline-block;vertical-align:top;">
              <div style="font-size:8pt;font-weight:800;color:#1B5E20;margin-bottom:2pt;">&#10003; YES</div>
              <div style="font-size:8pt;color:#2E7D32;line-height:1.4;">${esc(step.text.replace(/^YES\s*[-—→>]\s*/i, ""))}</div>
            </div>`;
          }
          if (step.type === "N") {
            return `<div style="background:#FFEBEE;border:1.5pt solid #E53935;padding:6pt 10pt;margin:3pt 0;width:${w};display:inline-block;vertical-align:top;">
              <div style="font-size:8pt;font-weight:800;color:#B71C1C;margin-bottom:2pt;">&#10007; NO</div>
              <div style="font-size:8pt;color:#C62828;line-height:1.4;">${esc(step.text.replace(/^NO\s*[-—→>]\s*/i, ""))}</div>
            </div>`;
          }
          if (step.type === "A") {
            // System automation — rounded dashed box
            return `<div style="background:#F3E5F5;border:1.5pt dashed #9C27B0;padding:6pt 10pt;margin:3pt 0;">
              <span style="font-size:9pt;color:#7B1FA2;font-weight:bold;">&#9881;</span>
              <span style="font-size:8.5pt;color:#4A148C;font-weight:600;"> ${esc(step.text)}</span>
            </div>`;
          }
          // User task [S] — solid box with user icon
          return `<div style="background:#EEF2FF;border:1.5pt solid #5C6BC0;padding:6pt 10pt;margin:3pt 0;">
            <span style="font-size:9pt;color:#5C6BC0;">&#128100;</span>
            <span style="font-size:8.5pt;color:#1A237E;font-weight:600;"> ${esc(step.text)}</span>
          </div>`;

                    </div>
                  )}
                  <div style={{ padding: "12px" }}>
                    {d.endToEndSwimlane ? (
                      <SwimlaneRenderer swimlane={d.endToEndSwimlane} width={550} />
                    ) : (
                      <div style={{ background: C.accentLight, borderRadius: 10, padding: "20px 16px", textAlign: "center" }}>
                        <div style={{ fontSize: 24, marginBottom: 6 }}>🚀</div>
                        <div style={{ fontSize: 13, fontWeight: 600, color: C.accent }}>E2E swimlane not generated</div>
                      </div>
                    )}
                    {/* To-Be improvements */}
                    {d.endToEndSwimlane && (
                      <div style={{ marginTop: 12, background: "#E8F5E9", border: "1px solid #66BB6A", borderRadius: 10, padding: "12px 16px" }}>
                        <div style={{ fontSize: 10, fontWeight: 700, color: "#2E7D32", textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>✅ S/4HANA Improvements</div>
                        <div style={{ fontSize: 11.5, color: "#1B5E20", lineHeight: 1.7 }}>
                          • Fiori-based UX — no SAP GUI needed<br/>
                          • Workflow-driven approvals with full audit trail<br/>
                          • Real-time processing — no batch delays<br/>
                          • Clean Core — zero custom ABAP<br/>
                          • End-to-end visibility via SAP Analytics Cloud
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Delta summary */}
              <div style={{ background: "white", border: `1px solid ${C.border}`, borderRadius: 14, padding: "16px 20px" }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 }}>🔄 Transformation Delta</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10 }}>
                  {[
                    { icon: "🖥", label: "UI", from: "SAP GUI + T-codes", to: "Fiori Launchpad", color: "#1E88E5" },
                    { icon: "⚙", label: "Automation", from: "Overnight batch jobs", to: "Real-time event-driven", color: "#7B1FA2" },
                    { icon: "✅", label: "Approvals", from: "Email + manual", to: "Workflow + My Inbox", color: "#2E7D32" },
                    { icon: "🔗", label: "Integration", from: "RFC / BAPI / PI", to: "OData API via CPI", color: "#E65100" },
                  ].map(({ icon, label, from, to, color }) => (
                    <div key={label} style={{ background: C.bg, borderRadius: 10, padding: "10px 12px", border: `1px solid ${C.border}` }}>
                      <div style={{ fontSize: 18, marginBottom: 4 }}>{icon}</div>
                      <div style={{ fontSize: 10, fontWeight: 700, color: color, textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
                      <div style={{ fontSize: 10, color: "#C62828", textDecoration: "line-through", marginBottom: 2 }}>{from}</div>
                      <div style={{ fontSize: 10.5, color: "#2E7D32", fontWeight: 600 }}>→ {to}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ── FIT-TO-STANDARD ── */}
          {activeTab === "fts" && d.fts?.assessments && (() => {
            const a = d.fts.assessments;
            const fits = a.filter(x => x.assessment === "FIT").length;
            const partials = a.filter(x => x.assessment === "PARTIAL_FIT").length;
            const gaps = a.filter(x => x.assessment === "GAP").length;
            return (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
                  {[{ n: fits, l: "FIT", c: "#059669", bg: "#ECFDF3" }, { n: partials, l: "PARTIAL FIT", c: "#D97706", bg: "#FFFBEB" }, { n: gaps, l: "GAP", c: "#DC2626", bg: "#FEF2F2" }].map(({ n, l, c, bg }) => (
                    <div key={l} style={{ background: bg, borderRadius: 14, padding: "16px 18px", textAlign: "center", border: `1px solid ${c}22` }}>
                      <div style={{ fontSize: 32, fontWeight: 800, color: c }}>{n}</div>
                      <div style={{ fontSize: 10, fontWeight: 700, color: c, letterSpacing: 1 }}>{l}</div>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize: 11, color: C.mute, textAlign: "center", fontStyle: "italic" }}>💡 Double-click any item to expand details and see recommended action</div>
                {a.map((item, i) => {
                  const isExp = expanded.has("fts-" + i);
                  const ac = item.assessment === "FIT" ? "#059669" : item.assessment === "GAP" ? "#DC2626" : "#D97706";
                  const abg = item.assessment === "FIT" ? "#ECFDF3" : item.assessment === "GAP" ? "#FEF2F2" : "#FFFBEB";
                  return (
                    <div key={i} onDoubleClick={() => toggleExpand("fts-" + i)} style={{ background: "white", border: `1.5px solid ${ac}${isExp ? "88" : "33"}`, borderRadius: 12, padding: "14px 18px", cursor: "pointer", transition: "all 0.2s", boxShadow: isExp ? `0 4px 16px ${ac}15` : "none" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
                        <span style={{ background: abg, color: ac, borderRadius: 6, padding: "3px 10px", fontSize: 11, fontWeight: 700 }}>{item.assessment}</span>
                        <span style={{ background: C.accentLight, color: C.accent, borderRadius: 6, padding: "2px 8px", fontSize: 10, fontWeight: 700 }}>{item.id}</span>
                        <span style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>{item.scopeItem}</span>
                        <span style={{ fontSize: 10, color: C.mute, marginLeft: "auto" }}>{item.effort} · {item.priority} {isExp ? "▼" : "▶"}</span>
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, fontSize: 12, color: C.sub }}>
                        <div><b style={{ color: C.ink }}>Standard:</b> {item.standardProcess}</div>
                        <div><b style={{ color: C.ink }}>Client:</b> {item.clientRequirement}</div>
                      </div>
                      {item.delta && <div style={{ fontSize: 12, color: "#D97706", marginTop: 4 }}>Δ {item.delta}</div>}
                      <div style={{ fontSize: 12, marginTop: 4 }}><b>Resolution:</b> {item.resolution}{item.configPath && item.configPath !== "N/A" && <span style={{ color: C.accent, fontSize: 11, marginLeft: 8 }}>⚙ {item.configPath}</span>}</div>

                      {/* ── EXPANDED DETAIL ── */}
                      {isExp && (
                        <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px dashed ${ac}44` }}>
                          {/* Recommendation */}
                          <div style={{ background: `${ac}08`, border: `1px solid ${ac}22`, borderRadius: 10, padding: "12px 16px", marginBottom: 10 }}>
                            <div style={{ fontSize: 10, fontWeight: 700, color: ac, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>💡 Recommendation</div>
                            <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.7 }}>{item.recommendation || (item.assessment === "FIT" ? "Accept the SAP standard process as-is. No configuration or extension needed. This is the ideal outcome — standard processes ensure upgrade safety and lower TCO." : item.assessment === "PARTIAL_FIT" ? "Close this gap via Business Configuration only. Avoid custom extensions. Configure the setting via the identified config path and validate in sandbox before transport." : "This gap requires an extension. Evaluate CFL (Tier-1) first for simple field/logic changes. Use BAS-RAP (Tier-2) for complex business logic. BTP CAP (Tier-3) only for side-by-side extensions with external integration needs.")}</div>
                          </div>

                          {/* Ideal Action */}
                          <div style={{ background: C.accentLight, borderRadius: 10, padding: "12px 16px", marginBottom: 10 }}>
                            <div style={{ fontSize: 10, fontWeight: 700, color: C.accent, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>🎯 Ideal Action</div>
                            <div style={{ fontSize: 12.5, color: C.ink, lineHeight: 1.7 }}>{item.idealAction || (item.assessment === "FIT" ? "Accept standard. Document in FTS register. No further action needed." : item.assessment === "PARTIAL_FIT" ? "Configure via " + (item.configPath || "Business Configuration") + ". Test in sandbox. Transport to production." : "Create gap resolution design document. Estimate effort (" + (item.effort || "TBD") + "). Assign to " + (item.assessment === "GAP" ? "extension team" : "config team") + ". Target: Realize phase.")}</div>
                          </div>

                          {/* Assessment detail grid */}
                          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                            <div style={{ background: C.bg, borderRadius: 8, padding: "10px 12px" }}>
                              <div style={{ fontSize: 9, fontWeight: 600, color: C.mute, textTransform: "uppercase" }}>Effort</div>
                              <div style={{ fontSize: 16, fontWeight: 700, color: C.ink }}>{item.effort || "TBD"}</div>
                              <div style={{ fontSize: 10, color: C.mute }}>{item.effort === "S" ? "< 2 weeks" : item.effort === "M" ? "2-6 weeks" : item.effort === "L" ? "6+ weeks" : ""}</div>
                            </div>
                            <div style={{ background: C.bg, borderRadius: 8, padding: "10px 12px" }}>
                              <div style={{ fontSize: 9, fontWeight: 600, color: C.mute, textTransform: "uppercase" }}>Priority</div>
                              <div style={{ fontSize: 16, fontWeight: 700, color: item.priority === "HIGH" ? C.err : item.priority === "MEDIUM" ? C.warn : C.ok }}>{item.priority || "TBD"}</div>
                              <div style={{ fontSize: 10, color: C.mute }}>{item.priority === "HIGH" ? "Must-have for go-live" : item.priority === "MEDIUM" ? "Important, can phase" : "Nice-to-have"}</div>
                            </div>
                            <div style={{ background: C.bg, borderRadius: 8, padding: "10px 12px" }}>
                              <div style={{ fontSize: 9, fontWeight: 600, color: C.mute, textTransform: "uppercase" }}>Upgrade Safe</div>
                              <div style={{ fontSize: 16, fontWeight: 700, color: item.assessment === "FIT" ? C.ok : item.assessment === "PARTIAL_FIT" ? C.ok : C.warn }}>{item.assessment === "GAP" ? "⚠ Risk" : "✓ Safe"}</div>
                              <div style={{ fontSize: 10, color: C.mute }}>{item.assessment === "GAP" ? "Extension may break on upgrade" : "Standard/config is upgrade-safe"}</div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })()}
          {activeTab === "fts" && !d.fts?.assessments && <div style={{ background: C.warnLight, borderRadius: 12, padding: 24, textAlign: "center" }}><div style={{ fontSize: 14, fontWeight: 600, color: C.warn }}>FTS not generated</div></div>}

          {/* ── NEXT STEPS ── */}
          {activeTab === "next" && d.next && (
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {d.next.actionItems?.length > 0 && <div style={{ background: "white", border: `1px solid ${C.border}`, borderRadius: 14, overflow: "hidden" }}>
                <div style={{ background: C.accent, padding: "10px 18px", color: "white", fontSize: 13, fontWeight: 700 }}>Action Items ({d.next.actionItems.length})</div>
                {d.next.actionItems.map((a, i) => (
                  <div key={i} style={{ display: "flex", gap: 10, padding: "10px 16px", borderBottom: `1px solid ${C.border}`, alignItems: "center" }}>
                    <span style={{ background: C.accentLight, color: C.accent, borderRadius: 6, padding: "2px 8px", fontSize: 10, fontWeight: 700, flexShrink: 0 }}>{a.id}</span>
                    <div style={{ flex: 1 }}><div style={{ fontSize: 12.5, fontWeight: 600, color: C.ink }}>{a.action}</div><div style={{ fontSize: 11, color: C.sub }}>{a.category} · {a.owner} · {a.phase} · {a.dueWeeks}</div></div>
                    <span style={{ background: a.priority === "HIGH" ? C.errLight : C.warnLight, color: a.priority === "HIGH" ? C.err : C.warn, borderRadius: 6, padding: "3px 8px", fontSize: 10, fontWeight: 700 }}>{a.priority}</span>
                  </div>
                ))}
              </div>}
              {d.next.risks?.length > 0 && <div style={{ background: "white", border: `1px solid ${C.border}`, borderRadius: 14, overflow: "hidden" }}>
                <div style={{ background: C.err, padding: "10px 18px", color: "white", fontSize: 13, fontWeight: 700 }}>Risks ({d.next.risks.length})</div>
                {d.next.risks.map((r, i) => (
                  <div key={i} style={{ padding: "10px 16px", borderBottom: `1px solid ${C.border}` }}>
                    <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 4 }}><b style={{ color: C.accent }}>{r.id}</b><span style={{ fontSize: 12, fontWeight: 600 }}>{r.description}</span><span style={{ marginLeft: "auto", fontSize: 10, color: C.err }}>P:{r.probability} I:{r.impact}</span></div>
                    <div style={{ fontSize: 11.5, color: C.sub }}>Mitigation: {r.mitigation}</div>
                  </div>
                ))}
              </div>}
              {d.next.signOff?.length > 0 && <div style={{ background: "white", border: `1px solid ${C.border}`, borderRadius: 14, overflow: "hidden" }}>
                <div style={{ background: C.ok, padding: "10px 18px", color: "white", fontSize: 13, fontWeight: 700 }}>Sign-Off</div>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead><tr style={{ background: C.accentLight }}>{["Role", "Title", "Responsibility", "Signature", "Date"].map(h => <th key={h} style={{ padding: "8px 12px", textAlign: "left", fontWeight: 600, color: C.accent, fontSize: 11 }}>{h}</th>)}</tr></thead>
                  <tbody>{d.next.signOff.map((s, i) => <tr key={i}><td style={{ padding: "8px 12px", borderBottom: `1px solid ${C.border}`, fontWeight: 600, color: C.accent }}>{s.role}</td><td style={{ padding: "8px 12px", borderBottom: `1px solid ${C.border}` }}>{s.title}</td><td style={{ padding: "8px 12px", borderBottom: `1px solid ${C.border}` }}>{s.responsibility}</td><td style={{ padding: "18px 12px", borderBottom: `1px solid ${C.border}` }} /><td style={{ padding: "18px 12px", borderBottom: `1px solid ${C.border}` }} /></tr>)}</tbody>
                </table>
              </div>}

              {/* ═══ RICEFW IMPLEMENTATION SUMMARY ═══ */}
              {(() => {
                // Derive counts from generated data
                const allApps = new Set();
                const workflows = [];
                const reports = [];
                const interfaces = [];
                const configs = d.l5Config || [];
                const enhancements = [];

                // Collect Fiori apps (Forms)
                (d.l3Areas || []).forEach(a => (a.fioriApps || []).forEach(app => allApps.add(app)));
                (d.l4Activities || []).forEach(a => { if (a.fioriApp) allApps.add(a.fioriApp); });

                // Identify workflows from steps
                (d.l4Activities || []).forEach(act => {
                  (act.steps || []).forEach(step => {
                    const sl = step.toLowerCase();
                    if (sl.includes("approval") || sl.includes("workflow") || sl.includes("release") || sl.includes("my inbox")) {
                      workflows.push({ activity: act.name, step, fioriApp: act.fioriApp, role: act.role });
                    }
                  });
                });

                // Identify reports from KPIs and analytics refs
                (d.l2?.kpis || []).forEach(k => reports.push({ type: "KPI", name: k, source: "SAP Analytics Cloud" }));
                (d.l4Activities || []).forEach(act => {
                  (act.steps || []).forEach(step => {
                    const sl = step.toLowerCase();
                    if (sl.includes("report") || sl.includes("monitor") || sl.includes("analytics") || sl.includes("dashboard")) {
                      reports.push({ type: "Report", name: step, source: act.fioriApp });
                    }
                  });
                });

                // Identify interfaces from description
                const desc = form.description || "";
                const intParts = desc.match(/[Ii]ntegration[s]?\s+(?:with\s+)?([^.]+)/g) || [];
                intParts.forEach(p => interfaces.push({ name: p.replace(/^[Ii]ntegration[s]?\s+(with\s+)?/, ""), type: "SAP Integration Suite (CPI)" }));
                if (!interfaces.length && form.integrations) {
                  form.integrations.split(/[,;]/).forEach(i => { if (i.trim()) interfaces.push({ name: i.trim(), type: "SAP Integration Suite (CPI)" }); });
                }

                // Identify enhancements/gaps from FTS
                (d.fts?.assessments || []).filter(a => a.assessment === "GAP" || a.assessment === "PARTIAL_FIT").forEach(a => {
                  enhancements.push({ scopeItem: a.scopeItem, assessment: a.assessment, resolution: a.resolution, effort: a.effort });
                });

                const categories = [
                  { icon: "🖥", label: "Forms", sublabel: "Fiori Applications", count: allApps.size, color: "#1E88E5", bg: "#EBF5FF", items: [...allApps] },
                  { icon: "🔄", label: "Workflows", sublabel: "Approval & Release", count: workflows.length, color: "#7B1FA2", bg: "#F3E5F5", items: workflows.map(w => w.step + " (" + w.role + ")") },
                  { icon: "📊", label: "Reports", sublabel: "Analytics & KPIs", count: reports.length, color: "#2E7D32", bg: "#E8F5E9", items: reports.map(r => r.name) },
                  { icon: "🔗", label: "Interfaces", sublabel: "CPI Integrations", count: interfaces.length, color: "#E65100", bg: "#FFF3E0", items: interfaces.map(i => i.name) },
                  { icon: "⚙", label: "Configurations", sublabel: "Business Config Items", count: configs.length, color: C.accent, bg: C.accentLight, items: configs.map(c => c.id + ": " + c.name + (c.scopeItem ? " (📌 " + c.scopeItem + ")" : "")) },
                  { icon: "🔧", label: "Enhancements", sublabel: "Gaps & Extensions", count: enhancements.length, color: "#DC2626", bg: "#FEF2F2", items: enhancements.map(e => e.scopeItem + " → " + e.resolution + " (" + e.effort + ")") },
                ];

                const total = categories.reduce((s, c) => s + c.count, 0);

                return (
                  <div style={{ background: "white", border: `2px solid ${C.accent}`, borderRadius: 16, overflow: "hidden", marginTop: 8 }}>
                    <div style={{ background: `linear-gradient(135deg, ${C.accent}, #3E1FA3)`, padding: "14px 20px", display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ fontSize: 22 }}>📋</div>
                      <div>
                        <div style={{ color: "white", fontSize: 15, fontWeight: 700, fontFamily: "'Fraunces',serif" }}>Implementation Summary — RICEFW</div>
                        <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 11 }}>Reports · Interfaces · Configuration · Enhancements · Forms · Workflows</div>
                      </div>
                      <div style={{ marginLeft: "auto", background: "rgba(255,255,255,0.15)", borderRadius: 10, padding: "8px 16px", textAlign: "center" }}>
                        <div style={{ color: "white", fontSize: 24, fontWeight: 800 }}>{total}</div>
                        <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 9, textTransform: "uppercase", letterSpacing: 1 }}>Total Items</div>
                      </div>
                    </div>

                    {/* Summary counters */}
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 0, borderBottom: `1px solid ${C.border}` }}>
                      {categories.map(cat => (
                        <div key={cat.label} style={{ padding: "12px 10px", textAlign: "center", borderRight: `1px solid ${C.border}`, background: cat.bg }}>
                          <div style={{ fontSize: 20 }}>{cat.icon}</div>
                          <div style={{ fontSize: 22, fontWeight: 800, color: cat.color }}>{cat.count}</div>
                          <div style={{ fontSize: 10, fontWeight: 700, color: cat.color }}>{cat.label}</div>
                          <div style={{ fontSize: 8, color: "#78909C" }}>{cat.sublabel}</div>
                        </div>
                      ))}
                    </div>

                    {/* Detailed lists */}
                    <div style={{ padding: "16px 20px" }}>
                      {categories.filter(c => c.items.length > 0).map(cat => (
                        <div key={cat.label} style={{ marginBottom: 14 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                            <span style={{ fontSize: 14 }}>{cat.icon}</span>
                            <span style={{ fontSize: 12, fontWeight: 700, color: cat.color }}>{cat.label} ({cat.count})</span>
                            <span style={{ fontSize: 10, color: "#78909C" }}>— {cat.sublabel}</span>
                          </div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 4, marginLeft: 20 }}>
                            {cat.items.slice(0, 15).map((item, j) => (
                              <div key={j} style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
                                <span style={{ color: cat.color, fontSize: 10, marginTop: 2, flexShrink: 0 }}>•</span>
                                <span style={{ background: cat.bg, color: cat.color, border: `1px solid ${cat.color}22`, borderRadius: 6, padding: "4px 10px", fontSize: 11, lineHeight: 1.5 }}>{typeof item === "string" ? item : item}</span>
                              </div>
                            ))}
                            {cat.items.length > 15 && <span style={{ fontSize: 10, color: "#78909C", padding: "3px 8px", marginLeft: 6 }}>+{cat.items.length - 15} more</span>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
          {activeTab === "next" && !d.next && <div style={{ background: C.warnLight, borderRadius: 12, padding: 24, textAlign: "center" }}><div style={{ fontSize: 14, fontWeight: 600, color: C.warn }}>Next Steps not generated</div></div>}

        </div>
      </div>

      {/* Footer */}
      <div style={{ borderTop: `1px solid ${C.border}`, padding: "10px 24px", background: "white", fontSize: 11, color: C.mute, display: "flex", justifyContent: "space-between" }}>
        <span>SAP S/4HANA Public Cloud · L2/L3/L4/L5 Process Documentation · Powered by Claude AI</span>
        <span>Clean Core · SAP Activate · BPMN 2.0 Swimlane</span>
      </div>
    </div>
  );
}



    const root = ReactDOM.createRoot(document.getElementById("bpd-root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
